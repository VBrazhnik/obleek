<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>obleek og:image source</title>
<!--
  Source for assets/img/og-image.png (published at 1200x630, the standard
  og:image size). Render at 2x and downsample so thin strokes (the mascot
  outline, the type) don't look soft on retina previews -- a straight 1x
  screenshot is blurrier. Regenerate with:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1200,630 \
      --screenshot=/tmp/og-image-2x.png \
      --virtual-time-budget=4000 "file://$PWD/tools/og-image.html"

    python3 -c "
    from PIL import Image
    Image.open('/tmp/og-image-2x.png').resize((1200, 630), Image.LANCZOS) \
        .save('assets/img/og-image.png', optimize=True)
    "

  Colours and type are taken from assets/css/style.css so the card matches the
  page it links to.
-->
<style>
  @font-face {
    font-family: "Rubik";
    src: url("../assets/fonts/rubik.woff2") format("woff2");
    font-weight: 300 900;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #121212;
    --ink: #F1F1EF;
    --accent: #D2D2CF;
    --accent-strong: #F6F6F4;
  }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Rubik", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-columns: 1fr 430px;
    align-items: center;
    gap: 44px;
    padding: 64px 68px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 30px;
  }
  .brand svg { width: 42px; height: 42px; fill: currentColor; display: block; }

  h1 {
    font-size: 60px;
    line-height: 1.04;
    letter-spacing: -0.028em;
    font-weight: 700;
    margin-bottom: 24px;
  }
  p {
    font-size: 23px;
    line-height: 1.45;
    color: var(--accent);
    max-width: 30ch;
  }

  /* The same heads-up notification the hero shows, so the share card and the
     page make the same promise. */
  .stage { position: relative; display: flex; justify-content: center; }
  .notif {
    width: 430px;
    background: #FEFEFD;
    color: #161616;
    border-radius: 26px;
    padding: 22px 26px 24px;
    box-shadow: 0 24px 54px rgba(0, 0, 0, 0.55);
  }
  .notif-head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .notif-icon {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #161616;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .notif-icon svg { width: 22px; height: 22px; fill: #FEFEFD; display: block; }
  .notif-app { font-size: 17px; color: #3C3C3A; }
  .notif-sep, .notif-time { font-size: 17px; color: #6E6E69; }
  .notif-title { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 5px; }
  .notif-body { font-size: 19px; color: #262624; max-width: none; }

  .mascot { width: 232px; display: block; margin: 26px auto 0; }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 512 512"><path d="M256 114C351.545 114 429 214.792 429 293.477C429 372.161 351.545 398.941 256 398.941C160.455 398.941 83.0002 372.161 83 293.477C83 214.792 160.455 114 256 114ZM193.09 215.765C171.12 215.765 153.309 238.545 153.309 266.646C153.309 294.748 171.12 317.529 193.09 317.529C215.06 317.529 232.87 294.748 232.87 266.646C232.87 238.545 215.06 215.765 193.09 215.765ZM320.758 215.765C298.788 215.765 280.978 238.545 280.978 266.646C280.978 294.748 298.788 317.529 320.758 317.529C342.728 317.529 360.539 294.748 360.539 266.646C360.539 238.545 342.728 215.765 320.758 215.765Z"/></svg>
      obleek
    </div>
    <h1>Expenses, from your bank's notifications.</h1>
    <p>Tap to confirm, instead of typing.</p>
  </div>

  <div class="stage">
    <div>
      <div class="notif">
        <div class="notif-head">
          <span class="notif-icon"><svg viewBox="0 0 512 512"><path d="M256 114C351.545 114 429 214.792 429 293.477C429 372.161 351.545 398.941 256 398.941C160.455 398.941 83.0002 372.161 83 293.477C83 214.792 160.455 114 256 114ZM193.09 215.765C171.12 215.765 153.309 238.545 153.309 266.646C153.309 294.748 171.12 317.529 193.09 317.529C215.06 317.529 232.87 294.748 232.87 266.646C232.87 238.545 215.06 215.765 193.09 215.765ZM320.758 215.765C298.788 215.765 280.978 238.545 280.978 266.646C280.978 294.748 298.788 317.529 320.758 317.529C342.728 317.529 360.539 294.748 360.539 266.646C360.539 238.545 342.728 215.765 320.758 215.765Z"/></svg></span>
          <span class="notif-app">obleek</span>
          <span class="notif-sep">&#183;</span>
          <span class="notif-time">now</span>
        </div>
        <div class="notif-title">New transaction detected</div>
        <div class="notif-body">4.60 USD &mdash; McDonald's &mdash; tap to confirm</div>
      </div>
      <img class="mascot" src="../assets/img/mascot-app.svg" alt="" />
    </div>
  </div>
</body>
</html>
